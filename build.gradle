allprojects {
    group = 'io.strategycontainer'
    version = '1.0-SNAPSHOT'
    repositories { mavenCentral() }
}

subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all']
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

project(':example-twap') {
    dependencies { implementation project(':strategy-api') }
}

project(':execution-support') { dependencies { api project(':strategy-api') } }
configure([project(':example-is'), project(':example-passive')]) {
    dependencies { implementation project(':execution-support') }
    tasks.named('jar') { from project(':execution-support').sourceSets.main.output; dependsOn ':execution-support:classes' }
}

project(':engine') {
    apply plugin: 'application'
    application { mainClass = 'io.strategycontainer.bootstrap.Main' }
    dependencies {
        api project(':strategy-api')
        implementation 'com.lmax:disruptor:4.0.0'
        testImplementation project(':example-twap')
        testImplementation project(':example-is')
        testImplementation project(':example-passive')
        testImplementation project(':execution-support')
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

configurations { javaFormatter }
dependencies { javaFormatter('com.google.googlejavaformat:google-java-format:1.28.0:all-deps') { transitive = false } }

tasks.register('formatJava', JavaExec) {
    description = 'Format Java sources using a build-only formatter dependency.'
    classpath = configurations.javaFormatter
    mainClass = 'com.google.googlejavaformat.java.Main'
    jvmArgs '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED'
    args '--replace'
    args fileTree(rootDir) { include '**/src/**/*.java'; exclude '**/build/**' }.files.sort()
}
